version: 2
updates:
  - package-ecosystem: npm
    directory: /relay
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /bot
    schedule:
      interval: weekly
    groups:
      rootsdk:
        patterns: ["@rootsdk/*"]
  - package-ecosystem: docker
    directory: /relay
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
